name: CI

on:
  push:
    branches: [main]
    # Run the full DB-backed suite on release tags too, so a tag is tested, not
    # just built. The release workflow additionally gates its build on a static
    # verify job.
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://cafe-pos:cafe-pos@localhost:5432/cafe-pos?schema=public
  # Shadow DB for `prisma migrate diff`. Same server, separate database.
  SHADOW_DATABASE_URL: postgresql://cafe-pos:cafe-pos@localhost:5432/shadow?schema=public
  JWT_ACCESS_SECRET: ci-access-secret-must-be-32-chars-or-more
  JWT_REFRESH_SECRET: ci-refresh-secret-must-be-32-chars-or-more
  JWT_POS_SECRET: ci-pos-secret-must-be-32-chars-or-more-ok
  # NOT `production`: this job migrates and seeds a throwaway database, and
  # claiming production while doing so hides prod-only code paths rather than
  # exercising them. Production behaviour is asserted explicitly where it
  # matters instead.
  NODE_ENV: test
  # DB-backed financial suites must never skip silently in CI.
  REQUIRE_DB_TESTS: '1'

jobs:
  test:
    name: Lint + Typecheck + Unit + Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cafe-pos
          POSTGRES_PASSWORD: cafe-pos
          POSTGRES_DB: cafe-pos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cafe-pos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm shared:build

      - name: Architecture boundary check
        run: pnpm lint:arch

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # `migrate deploy` applies committed migrations and fails on anything
      # unexpected. The previous `migrate dev` would author a new migration to
      # paper over drift, so CI could go green on a schema no migration builds.
      - name: Prisma migrate (deploy)
        run: pnpm --filter @erp/api db:deploy

      # Drift gate: the migration folder must reproduce schema.prisma exactly.
      # Empty output means no difference; anything else fails the build.
      - name: Schema drift check
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE shadow;' || true
          DIFF=$(pnpm --filter @erp/api exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code 2>&1) && echo "No drift." || {
              echo "::error::schema.prisma and prisma/migrations have drifted."
              echo "$DIFF"
              exit 1
            }

      - name: Seed
        run: pnpm --filter @erp/api db:seed

      - name: Unit + accounting-invariant tests
        run: pnpm --filter @erp/api test -- --testPathIgnorePatterns integration

      - name: Integration tests (DB-backed)
        run: pnpm --filter @erp/api test:integration

      # Money suites run only against a disposable pos_stage1_* database; the
      # release gate also re-runs the whole suite reporting skips and runs the
      # production preflight against the seeded database.
      - name: Cash-flow release gate (isolated money suites + preflight)
        env:
          POS_TEST_DATABASE_URL: postgresql://cafe-pos:cafe-pos@localhost:5432/pos_stage1_1?schema=public
          SKIP_WEB_BUILD: '1'
          # Integration suites add fixture organizations; certify the seeded tenant.
          PREFLIGHT_SCOPE: --code DEMO
        run: |
          psql "postgresql://cafe-pos:cafe-pos@localhost:5432/cafe-pos" -c 'CREATE DATABASE pos_stage1_1;' || true
          pnpm release:gate

      - name: Build API
        run: pnpm --filter @erp/api build

      - name: Build web
        run: pnpm --filter @erp/web build